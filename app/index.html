<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acclimate — Crew roster</title>
<link rel="stylesheet" href="../web/tokens.css">
<link rel="stylesheet" href="styles/components.css">
</head>
<body>
<div class="app" id="app">

  <!-- NavRail: one entry per view --------------------------------------- -->
  <nav class="rail" aria-label="Views">
    <button class="rail-btn" data-view="roster" aria-selected="true" title="Crew roster">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.5">
        <rect x="2.75" y="3.75" width="14.5" height="12.5"/>
        <line x1="2.75" y1="7.75" x2="17.25" y2="7.75"/>
        <line x1="2.75" y1="12" x2="17.25" y2="12"/>
        <line x1="8" y1="7.75" x2="8" y2="16.25"/>
      </svg>
    </button>
    <button class="rail-btn" data-view="map" aria-selected="false" title="Exposure map">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.5">
        <path d="M2.75 5.25 7.25 3.5v11.25L2.75 16.5z"/>
        <path d="M7.25 3.5l5.5 1.75v11.25L7.25 14.75z"/>
        <path d="M12.75 5.25 17.25 3.5v11.25L12.75 16.5z"/>
      </svg>
    </button>
    <span class="rail-spacer"></span>
    <button class="rail-btn" id="cmd-copy" title="Copy compliance record">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.5">
        <rect x="3.25" y="3.25" width="9" height="9"/>
        <rect x="7.75" y="7.75" width="9" height="9"/>
      </svg>
    </button>
    <button class="rail-btn" id="cmd-density" aria-pressed="false" title="Field density">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.5">
        <line x1="3.25" y1="5" x2="16.75" y2="5"/>
        <line x1="3.25" y1="10" x2="16.75" y2="10"/>
        <line x1="3.25" y1="15" x2="16.75" y2="15"/>
      </svg>
    </button>
  </nav>

  <!-- Main: slim command bar + full-width content ------------------------ -->
  <main class="main">
    <div class="commandbar">
      <h1 id="bar-title">Crew roster</h1>
      <span class="sub" id="bar-sub"></span>
      <span class="spacer"></span>
      <span id="commands"></span>
    </div>
    <div class="content" id="content"></div>
  </main>

  <!-- Drawer: opens on demand -------------------------------------------- -->
  <aside class="drawer" aria-label="Detail">
    <div class="drawer-head">
      <strong id="drawer-title">Worker</strong>
      <span class="spacer"></span>
      <button class="btn btn-quiet" id="drawer-close" title="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"
             stroke="currentColor" stroke-width="1.5">
          <line x1="3" y1="3" x2="11" y2="11"/>
          <line x1="11" y1="3" x2="3" y2="11"/>
        </svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <!-- StatusBar ----------------------------------------------------------- -->
  <footer class="statusbar">
    <span><span class="sb-label">Source</span> <span id="sb-source"></span></span>
    <span><span class="sb-label">Date</span> <span id="sb-date"></span></span>
    <span><span class="sb-label">Cache</span> <span id="sb-cache"></span></span>
    <span><span class="sb-label">Model</span> <span id="sb-model"></span></span>
    <span class="spacer"></span>
    <span id="sb-message"></span>
  </footer>

</div>

<script src="data/roster.js"></script>
<script src="data/map.js"></script>
<script src="data/basemap.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
