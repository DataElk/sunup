<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunup</title>
<link rel="stylesheet" href="../web/tokens.css">
<link rel="stylesheet" href="styles/components.css">
</head>
<body>

<div class="shell" id="shell">

  <!-- One navigation surface for the product, workspaces, and entity tree. -->
  <aside class="sidenav">
    <a class="brand" href="#/today" aria-label="Sunup home">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span class="brand-copy">
        <strong>Sunup</strong>
        <span>Heat work planner</span>
      </span>
    </a>

    <nav class="rail" id="rail" aria-label="Primary navigation"></nav>

    <div class="navpane">
      <div class="navpane-head" id="tree-title">Sites and crews</div>
      <div class="navpane-body" id="tree"></div>
    </div>

    <footer class="statusbar" id="statusbar"></footer>
  </aside>

  <!-- Main: command bar over content -------------------------------------- -->
  <main class="main">
    <div class="cmdbar-host" id="commandbar"></div>
    <div class="content" id="content"></div>
  </main>

</div>

<script src="data/constants.js"></script>
<script src="data/weather.js"></script>
<script src="data/seed.js"></script>
<script src="data/map.js"></script>
<script src="data/basemap.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
