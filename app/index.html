<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acclimate — Crew roster</title>
<link rel="stylesheet" href="../web/tokens.css">
<link rel="stylesheet" href="styles/components.css">
</head>
<body>
<div class="app">

  <!-- Ribbon ------------------------------------------------------------- -->
  <header class="ribbon">
    <div class="ribbon-title">
      <strong>Acclimate</strong>
      <span>Crew roster · <span id="crew-summary"></span></span>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-group-body">
        <button class="btn" id="cmd-detail" aria-pressed="true">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <rect x="1.5" y="1.5" width="11" height="11" fill="none"
                  stroke="currentColor"/>
            <line x1="1.5" y1="5" x2="12.5" y2="5" stroke="currentColor"/>
            <line x1="6" y1="5" x2="6" y2="12.5" stroke="currentColor"/>
          </svg>
          Worker detail
        </button>
        <button class="btn" id="cmd-compliance" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <rect x="2.5" y="1.5" width="9" height="11" fill="none"
                  stroke="currentColor"/>
            <line x1="4.5" y1="4.5" x2="9.5" y2="4.5" stroke="currentColor"/>
            <line x1="4.5" y1="7" x2="9.5" y2="7" stroke="currentColor"/>
            <line x1="4.5" y1="9.5" x2="7.5" y2="9.5" stroke="currentColor"/>
          </svg>
          Compliance record
        </button>
      </div>
      <div class="ribbon-group-label">View</div>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-group-body">
        <button class="btn" id="cmd-print">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <rect x="3.5" y="1.5" width="7" height="3" fill="none"
                  stroke="currentColor"/>
            <rect x="1.5" y="4.5" width="11" height="5" fill="none"
                  stroke="currentColor"/>
            <rect x="3.5" y="9.5" width="7" height="3" fill="none"
                  stroke="currentColor"/>
          </svg>
          Print
        </button>
        <button class="btn" id="cmd-copy">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <rect x="1.5" y="1.5" width="8" height="8" fill="none"
                  stroke="currentColor"/>
            <rect x="4.5" y="4.5" width="8" height="8" fill="none"
                  stroke="currentColor"/>
          </svg>
          Copy record
        </button>
      </div>
      <div class="ribbon-group-label">Export</div>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-group-body">
        <button class="btn" id="cmd-density" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <line x1="1.5" y1="3" x2="12.5" y2="3" stroke="currentColor"/>
            <line x1="1.5" y1="7" x2="12.5" y2="7" stroke="currentColor"/>
            <line x1="1.5" y1="11" x2="12.5" y2="11" stroke="currentColor"/>
          </svg>
          Field density
        </button>
      </div>
      <div class="ribbon-group-label">Display</div>
    </div>
  </header>

  <!-- Workspace ---------------------------------------------------------- -->
  <main class="workspace">
    <section class="panel">
      <div class="panel-title">
        Who works today
        <span class="sub">worst first · click a row for why</span>
      </div>
      <div class="toolbar">
        <span class="toolbar-label">Crew</span>
        <span class="spacer"></span>
        <span class="toolbar-label">Calendar vs model shown on every row</span>
      </div>
      <div class="panel-body" id="roster-body"></div>
    </section>

    <div class="splitter" role="separator" aria-orientation="vertical"></div>

    <section class="panel">
      <div class="panel-title">
        <span id="side-title">Worker</span>
        <span class="sub" id="side-sub"></span>
      </div>
      <div class="panel-body" id="side-body"></div>
    </section>
  </main>

  <!-- Status bar --------------------------------------------------------- -->
  <footer class="statusbar">
    <span><span class="sb-label">Source</span> <span id="sb-source"></span></span>
    <span><span class="sb-label">Date</span> <span id="sb-date"></span></span>
    <span><span class="sb-label">Cache</span> <span id="sb-cache"></span></span>
    <span><span class="sb-label">Model</span> <span id="sb-assumed"></span></span>
    <span class="spacer"></span>
    <span id="sb-message"></span>
  </footer>

</div>

<script src="data/roster.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
