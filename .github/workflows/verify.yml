name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Seed the offline fixture cache
        run: python scripts/seed_cache.py
      - name: Run model and interface tests
        run: python -m pytest
      - name: Check the design system
        run: node scripts/check-design.mjs
